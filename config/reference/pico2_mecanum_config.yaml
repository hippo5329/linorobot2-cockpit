# pico2_mecanum -- single source of truth for this robot.
# One robot per file, one base controller per robot.
#
# UNVERIFIED ON HARDWARE: generated and checked through the header and env
# generators only; no 4-motor rig has run it yet.
#
# A wired Raspberry Pi Pico 2 mecanum robot: four BTS7960-class drivers in the
# two-PWM scheme, four quadrature encoders, an MPU6050 on I2C0, a battery
# divider on ADC0, and the LD19 on the robot computer's own USB port (the
# MCU never sees the scan). 21 of the 26 GPIOs are used; GP0/GP1 (UART0) are
# left free on purpose as a debug console, GP4/GP5 (UART1) for a second
# serial device.
robot:
  name: pico2_mecanum
  description: Raspberry Pi Pico 2 mecanum (4WD, real hardware)
base_controller:
  name: pico2
  description: Raspberry Pi Pico 2, mecanum, real hardware
  mcu: pico2
  board: rpipico2
  driver_type: BTS7960
  transport: serial
  serial_port: /dev/ttyACM0
  baudrate: 921600
  # The LD19 plugs into the robot computer, not the MCU: no MCU pins, no UART
  # budget, and the scan never crosses the micro-ROS link.
  lidar:
    model: ld19
    comm_mode: serial
    serial_port: /dev/ttyUSB0
    baudrate: 230400
  sensors:
    imu: MPU6050
    mag: NONE
    use_sim_imu: false
    use_sim_mag: false
    use_sim_wheel: false
    use_sim_ld19: false
    use_sim_env: false
    current: INA219
    env: BMP280
  # The simulated world. Written out in full because sim mode is the default:
  # on a bench run these ARE the robot. Every key is optional -- absent, the
  # firmware keeps its compiled default, which is the value shown here.
  # robot_radius is omitted on purpose: it follows the costmaps' robot_radius.
  simulation:
    map_width: 10.0                   # the simulated room, metres, centred on the origin
    map_height: 6.0
    wall_obstacle: true               # the obstacle the Nav2 test goal sits behind
    wall_x1: 2.0
    wall_y1: -1.5
    wall_x2: 2.0
    wall_y2: 1.5
    robot_mass: 3.5                   # kg -- sets the wheels' spin-up time constant
    wheel_noise_rpm: 1.0              # +/- peak white noise on the reported RPM
    gear_efficiency: 0.75             # fraction of motor torque the reduction returns
    gear_drag_rpm: 12.0               # constant (Coulomb) drag, RPM/s, while turning
    battery_sag: 0.25                 # fraction of V_oc lost at four-wheel stall current
    battery_sag_tau_ms: 400           # the pack sags, and recovers, over this long
    driver_drop: 0.03                 # bridge's fixed voltage floor, present at any current
    driver_resistance: 0.1            # bridge's current-proportional loss, instant
    motor_stall_amps: 2.5             # datasheet stall current at the motor's rated voltage
    driver_current_limit: 0.0         # 0 = none fitted; caps torque, so it bites from rest
  pins:
    # Two-PWM (bts7960) drivers: in_a / in_b carry the complementary PWM, pwm
    # is the driver's enable. One GPIO (GP22) enables all four bridges -- the
    # driver holds it HIGH, once per motor, which is idempotent. Each motor's
    # pair sits on one RP2350 PWM slice (GP2/3 = slice 1, GP6/7 = 3, GP8/9 =
    # 4, GP10/11 = 5) so a slice never has to serve two motors.
    #
    # Numbering is linorobot2's: 1 front-left, 2 front-right, 3 rear-left,
    # 4 rear-right. The right-hand motors are inverted because they are
    # mounted mirrored; correct that here, never by swapping wires.
    motor1:
      pwm: 22
      in_a: 2
      in_b: 3
      invert: false
    motor2:
      pwm: 22
      in_a: 6
      in_b: 7
      invert: false
    motor3:
      pwm: 22
      in_a: 8
      in_b: 9
      invert: false
    motor4:
      pwm: 22
      in_a: 10
      in_b: 11
      invert: false
    encoder1:
      pin_a: 12
      pin_b: 13
      invert: false
    encoder2:
      pin_a: 14
      pin_b: 15
      invert: false
    encoder3:
      pin_a: 16
      pin_b: 17
      invert: false
    encoder4:
      pin_a: 18
      pin_b: 19
      invert: false
    # I2C0 on GP20/GP21 (a valid SDA0/SCL0 pair on the RP2350).
    i2c:
      sda: 20
      scl: 21
    # GP25, the real LED on a non-W board -- which is what the design assumes.
    # The RP2 images are BUILT from the W envs so the radio is available to
    # anyone who enters an AP list, but the hardware assumption stays non-W:
    # the blink is the only thing a board says before micro-ROS is up, and a
    # bench board in sim mode needs it as much as a wired one. On an actual
    # W board GP25 belongs to the CYW43 bus, so those set `led` in the env.
    led: 25
    # ADC0. 30k / 7.5k divider: 5:1, so a 3S pack (12.6 V) reads 2.52 V.
    battery:
      pin: 26
      r1: 30000
      r2: 7500
    # GP27/GP28: the only header pins this design leaves unclaimed besides the
    # two debug UARTs, and the pair the bench Pico 2 is physically wired to.
    # An HC-SR04+ was the one peripheral no reference config had ever enabled,
    # so TRIG_PIN/ECHO_PIN were compiled out of every released image and the
    # interrupt-driven driver in lib/range had never run on RP2 silicon.
    sonar:
      trigger: 27
      echo: 28
  # The forward hazard stop, in the firmware, below ROS. It runs every control
  # cycle, so it still works when the ROS side is wedged, the link has dropped
  # or the planner is confident and wrong -- which is the case Nav2's own
  # collision monitor cannot cover, because it IS the ROS side.
  #
  # Enabled here and nowhere else: this is the only reference config with a
  # real HC-SR04 wired (GP27/GP28 above). A board with no sonar reports -1 and
  # is never blocked, so enabling it there would be theatre.
  #
  # It only blocks FORWARD motion. Reverse and rotation stay available, or a
  # robot that stopped against something would have no way to back off.
  #
  # Never armed against a simulated obstacle: mcu_env.py forces this off when
  # the range is raycast out of the sim room, so a bench board running this
  # config in sim mode behaves exactly as it did before.
  safety_stop:
    enabled: true
    range_m: 0.25
kinematics:
  base_type: mecanum
  stamped_cmd_vel: auto
  # 97 mm mecanum wheels, 0.30 m track, 0.24 m wheelbase; 12 V 333 RPM gear
  # motors with 11 PPR magnetic encoders behind a 30:1 gearbox, quadrature
  # decoded: 11 * 4 * 30 = 1320 counts per wheel revolution.
  wheel_diameter: 0.1
  lr_wheels_distance: 0.271
  fr_wheels_distance: 0.18   # the shared footprint (robot_radius 0.26) has to contain the body
                          # AND the wheels, which stick out past it -- see
                          # gen_robot_description.config_warnings()
  max_rpm: 140
  counts_per_rev: 4000
  # DERIVED -- the driver margin, not a hand-picked derating.
  #
  # The share of the motor's no-load speed that survives the gearbox, the gear
  # drag, the friction, the pack's sag and the bridge. Measured off the
  # drivetrain model on test_acc's 1 s profile and rewritten by
  # scripts/drivetrain_report.py, so it follows the load: this chassis at 3.5 kg
  # keeps 0.87, at 8 kg it would keep 0.71. It was 0.85 for every robot.
  max_rpm_ratio: 0.8
  # The parts, not the product: counts_per_rev = encoder_ppr x quadrature x
  # gear_ratio = 11 x 4 x 30 = 1320, computed by the generators. Give
  # counts_per_rev directly instead if that is the number you have.
  encoder_ppr: 11
  quadrature: 4
  gear_ratio: 30
  pwm_bits: 10
  pwm_frequency: 20000
  motor_operating_voltage: 12
  motor_power_max_voltage: 12
  pid:
    kp: 0.6
    ki: 0.8
    kd: 0.5
# The robot's body, for the URDF that robot_state_publisher broadcasts as the TF tree
# (scripts/gen_robot_description.py). Metres, kilograms, radians. The wheel radius and the
# axle positions come from kinematics above; this block is what kinematics does not say.
geometry: {}   # Derived from the kinematics above. This is a REAL robot design --
               # a 97 mm-wheel mecanum AMR -- so it keeps its own measured wheels and
               # wheelbase; what it shares with every other config is the MOUNT (laser
               # at the base origin) and the Nav2 template. A default/bare module is
               # the thing that must be identical on every MCU and drive type.
               #
               # ekf/slam/nav2 below are the ONE template every reference shares
               # (RotationShim + RegulatedPurePursuit, velocity-fused EKF); the only
               # mecanum differences are vy fused in the EKF and lateral limits in
               # the controller and velocity smoother. RPP itself drives a mecanum
               # as a differential base -- no lateral motion is commanded by Nav2.
ekf:
  ekf_filter_node:
    ros__parameters:
      frequency: 50.0
      two_d_mode: true
      publish_tf: true
      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: odom
      odom0: odom/unfiltered
      odom0_config:
      - false
      - false
      - false
      - false
      - false
      - false
      - true    # vx
      - true    # vy: the firmware publishes it with TWIST_COV 1e-5 -- on a
      - false    #     differential base that zero is the non-holonomic constraint
      - false
      - false
      - true    # yaw rate
      - false
      - false
      - false
      imu0: imu/data
      imu0_config:
      - false
      - false
      - false
      - false
      - false
      - true    # absolute yaw: madgwick, anchored by the magnetometer
      - false
      - false
      - false
      - false
      - false
      - true    # yaw rate
      - true    # ax
      - true    # ay
      - false
slam:
  slam_toolbox:
    ros__parameters:
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None
      odom_frame: odom
      map_frame: map
      base_frame: base_link
      scan_topic: /scan
      mode: mapping
      debug_logging: false
      throttle_scans: 1
      transform_publish_period: 0.02
      # The map->odom correction is stamped with the CLOCK, not with the scan
      # that produced it.
      #
      # slam_toolbox's publishTransformLoop runs at transform_publish_period
      # (50 Hz here) but, with restamp_tf false, stamps every message
      # scan_timestamp + transform_timeout -- and scan_header is assigned on
      # every incoming scan. So the stamp advances only as fast as /scan
      # ARRIVES, and the loop republishes the same stamp in between.
      #
      # That makes every TF consumer hostage to scan latency. Our Wi-Fi is
      # strong but shared, so datagrams queue behind other traffic and a scan
      # lands late; its stamp is then old, map->odom inherits the age, and a
      # controller asking for the transform at "now" is asking into the future.
      # That is the whole of error_code=102: measured 601 ms of frozen stamp on
      # a SERIAL leg, and the Wi-Fi legs fail more often for the same reason
      # with latency on top.
      #
      # Stamping with now() is what AMCL does with its own map->odom, and it is
      # right for the same reason: this is a slowly-varying CORRECTION, not an
      # observation. Its value is unchanged between scans, so asserting it is
      # current is true.
      #
      # It does not hide a dead LiDAR. nav2_collision_monitor's `scan` source
      # has source_timeout 1.0 and stops the robot when the topic goes quiet --
      # which is the component whose job that is, and it says so out loud.
      restamp_tf: true
      map_update_interval: 5.0
      resolution: 0.05
      max_laser_range: 10.0
      minimum_time_interval: 0.5
      transform_timeout: 0.2
      tf_buffer_duration: 30.0
      stack_size_to_use: 40000000
      enable_interactive_mode: true
      use_scan_matching: true
      use_scan_barycenter: true
      minimum_travel_distance: 0.5
      minimum_travel_heading: 0.5
      scan_buffer_size: 10
      scan_buffer_maximum_scan_distance: 10.0
      link_match_minimum_response_fine: 0.1
      link_scan_maximum_distance: 1.5
      loop_search_maximum_distance: 3.0
      do_loop_closing: true
      loop_match_minimum_chain_size: 10
      loop_match_maximum_variance_coarse: 3.0
      loop_match_minimum_response_coarse: 0.35
      loop_match_minimum_response_fine: 0.45
      correlation_search_space_dimension: 0.5
      correlation_search_space_resolution: 0.01
      correlation_search_space_smear_deviation: 0.1
      loop_search_space_dimension: 8.0
      loop_search_space_resolution: 0.05
      loop_search_space_smear_deviation: 0.03
      distance_variance_penalty: 0.5
      angle_variance_penalty: 1.0
      fine_search_angle_offset: 0.00349
      coarse_search_angle_offset: 0.349
      coarse_angle_resolution: 0.0349
      minimum_angle_penalty: 0.9
      minimum_distance_penalty: 0.5
      use_response_expansion: true
nav2:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      odom_topic: /odom
      bt_loop_duration: 10
      default_server_timeout: 20
      wait_for_service_timeout: 30000
      action_server_result_timeout: 900.0
      navigators:
      - navigate_to_pose
      - navigate_through_poses
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      error_code_names:
      - compute_path_error_code
      - follow_path_error_code
  controller_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      controller_frequency: 20.0
      costmap_update_timeout: 0.3
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001   # mecanum: lateral velocity is real
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins:
      - progress_checker
      goal_checker_plugins:
      - general_goal_checker
      controller_plugins:
      - FollowPath
      use_realtime_priority: false
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: true
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.35
        yaw_goal_tolerance: 0.35
      FollowPath:
        plugin: nav2_rotation_shim_controller::RotationShimController
        transform_tolerance: 0.3   # a throttled robot PC runs this loop at 7-8 Hz; 0.1 s aborted a goal mid-route
        primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        angular_dist_threshold: 0.785
        angular_disengage_threshold: 0.3925
        forward_sampling_distance: 0.5
        rotate_to_heading_angular_vel: 0.57
        max_angular_accel: 0.87
        simulate_ahead_time: 1.0
        rotate_to_goal_heading: false
        rotate_to_heading_once: true
        use_path_orientations: false
        desired_linear_vel: 0.24
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins:
      - GridBased
      costmap_update_timeout: 1.0
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.5
        use_astar: false
        allow_unknown: true
  smoother_server:
    ros__parameters:
      smoother_plugins:
      - simple_smoother
      simple_smoother:
        plugin: nav2_smoother::SimpleSmoother
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: true
  behavior_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      wait:
        plugin: nav2_behaviors::Wait
      local_frame: odom
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.46
      min_rotational_vel: 0.23
      rotational_acc_lim: 1.74
  velocity_smoother:
    ros__parameters:
      enable_stamped_cmd_vel: false
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: OPEN_LOOP
      # DERIVED from the motors, not typed in. Do not hand-edit.
      #
      #   python3 scripts/drivetrain_report.py --params <this file>
      #
      # regenerates these, and saving the robot in the cockpit rewrites them,
      # unless kinematics.auto_nav2_limits is false. The numbers come from the
      # drivetrain model in firmware/common/lib/encoder/sim_wheel.h, run on
      # test_acc's own 1 s profile -- so they follow the wheels, the load, the
      # gearing and the pack rather than somebody's judgement about one chassis.
      #
      # Why it is done this way: a combined translate-and-rotate costs linear +
      # rotational wheel speed at the outer wheel, and each limit looked
      # survivable alone. The old ceiling of 0.5 m/s with 2.5 rad/s asked 203 rpm
      # of a mecanum base -- 171% of what the motors have. The controller then
      # commands what it cannot get, Kinematics scales the whole request down to
      # fit, and tracking degrades: three mecanum legs left the room on
      # 2026-09-23 (stamp 20260923-205120), all at leg 4/8, on both distros. It
      # had always been over budget (0.4 m/s with 1.8 rad/s is 123 rpm, 103%),
      # and correcting the mecanum rotation radius to the textbook (lx + ly) made
      # the same request cost 154 rpm, which is where it stopped being marginal.
      #
      # The angular figure is per-drivetrain now, for that reason: mecanum turns
      # on (lr + fr)/2 = 0.2255 m where a differential base turns on lr/2 =
      # 0.1355 m, so the same yaw rate costs it 66% more wheel speed and it is
      # given a correspondingly lower ceiling.
      max_velocity:
      - 0.29
      - 0.29
      - 0.69
      min_velocity:
      - -0.29
      - -0.29
      - -0.69
      max_accel:
      - 0.8
      - 0.8
      - 0.87
      max_decel:
      - -0.8
      - -0.8
      - -0.87
      odom_topic: odom
      odom_duration: 0.1
      deadband_velocity:
      - 0.0
      - 0.0
      - 0.0
      velocity_timeout: 1.0
  collision_monitor:
    ros__parameters:
      enable_stamped_cmd_vel: false
      base_frame_id: base_link
      odom_frame_id: odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 1.0
      base_shift_correction: true
      stop_pub_timeout: 2.0
      polygons:
      - FootprintApproach
      FootprintApproach:
        type: polygon
        action_type: approach
        footprint_topic: /local_costmap/published_footprint
        time_before_collision: 1.2
        simulation_time_step: 0.1
        min_points: 6
        visualize: false
        enabled: true
      observation_sources:
      - scan
      - sonar
      scan:
        type: scan
        topic: scan
        min_height: 0.15
        max_height: 2.0
        enabled: true
      # The second obstacle input, and the only reference config that may ask
      # for it: base_controller.pins.sonar above names a real HC-SR04 (GP27 /
      # GP28). The launcher drops this source on a robot whose pins read -1,
      # because a collision_monitor source that never publishes does not
      # degrade -- it stops the robot, which is right for a sensor that died
      # and wrong for one that was never fitted.
      #
      # One point per degree across the firmware's 30 degree cone, so 31
      # points, well inside the monitor's ceiling.
      sonar:
        type: range
        topic: sonar
        obstacles_angle: 0.0175
        enabled: true
  docking_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      controller_frequency: 20.0
      initial_perception_timeout: 5.0
      wait_charge_timeout: 5.0
      dock_approach_timeout: 30.0
      undock_linear_tolerance: 0.05
      undock_angular_tolerance: 0.1
      max_retries: 3
      base_frame: base_link
      fixed_frame: odom
      dock_backwards: false
      dock_prestaging_tolerance: 0.5
      dock_plugins:
      - simple_charging_dock
      simple_charging_dock:
        plugin: opennav_docking::SimpleChargingDock
        docking_threshold: 0.05
        staging_x_offset: -0.7
        use_external_detection_pose: true
        use_battery_status: false
        use_stall_detection: false
  waypoint_follower:
    ros__parameters:
      loop_rate: 20
      stop_on_failure: false
      action_server_result_timeout: 900.0
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        enabled: true
        waypoint_pause_duration: 200
  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        transform_tolerance: 0.5   # a throttled robot PC delivers TF late; the planner aborted a goal with 'Failed to transform end pose to global frame'
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.26
        plugins:
        - voxel_layer
        - inflation_layer
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        voxel_layer:
          plugin: nav2_costmap_2d::VoxelLayer
          enabled: true
          publish_voxel_map: true
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        transform_tolerance: 1.0   # the PLANNER transforms the goal with this one, and 0.5 still lost a goal to 'Failed to transform end pose to global frame'; the global costmap updates at 1 Hz, so a second of slack is consistent with it
        robot_radius: 0.26
        resolution: 0.05
        track_unknown_space: true
        plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: true
ros_distro: jazzy
