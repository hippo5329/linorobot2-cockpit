# SparkFun XRP Kit -- the current XRP Controller (RP2350B + Radio Module 2) on
# SparkFun's 2WD chassis with its two encoder gearmotors and 4xAA pack.
#
# Every board fact below comes from the board itself, not from a preset:
#   * pins: the XRP Controller KiCad PCB's net names (GPIOnn/<function>), which
#     MicroPython's SPARKFUN_XRP_CONTROLLER pins.csv and arduino-pico's
#     sparkfun_xrp_controller variant repeat. SparkFun's web page puts the IMU
#     on GPIO4/5; the PCB has it on GPIO38/39 (I2C1), and so does XRPLib.
#   * motors: DRV8411A in IN/IN mode -- PWM on both inputs, our `bts7960`
#     two-PWM scheme, no enable pin. XRPLib's DualPWMMotor sends forward effort
#     to IN2 on the right motor and, because the left one is mirrored
#     (flip_dir=True), to IN1 on the left. Forward PWM here goes to in_b, so
#     the left motor is in_a 35 / in_b 34 and needs no invert flag.
#   * encoders: 12 counts per motor turn through a 48.75:1 gearbox = 585 per
#     wheel turn (XRPLib encoder.py). The left count is negated in XRPLib, and
#     the PIO quadrature program here counts the same way, so encoder1.invert
#     is the one inverted unit in any reference config -- it cannot be fixed by
#     swapping A and B, because the PIO program needs B = A + 1.
#   * wheels: 60 mm diameter, 155 mm track (XRPLib DifferentialDrive defaults).
#   * motor: 140 RPM no-load at 4.5 V (SparkFun "Hobby Motor with Encoder", the
#     XRP's own); 0.75 A stall at 6 V.
#   * battery: VIN -> 100k -> GPIO46 (ADC6) -> 33k -> GND, through the VIN MEAS
#     jumper. 4xAA is 6 V fresh, 4.8 V on NiMH.
#
# The XRP's kinematics are its own, not the default chassis: it is a fixed
# commercial kit whose numbers are published, so tests/test_default_chassis.py
# exempts it by name. Nav2/EKF/SLAM stay on the shared template.
#
# The kit has no LiDAR; Nav2 needs one, so an LD19 on the robot computer's USB
# (/dev/ttyUSB0) is assumed. micro-ROS stays on USB serial: the RM2's SPI link
# is too slow for the transport, so Wi-Fi carries syslog and OTA only (the
# credentials and the syslog sink are in secrets.yaml).
#
# Not yet run on hardware: the motor/encoder directions above follow XRPLib and
# must be confirmed with test_motors on the first board (expected 2026-10).
robot:
  name: xrp
  description: SparkFun XRP Kit -- XRP Controller (RP2350B + RM2), 2WD, LSM6DSOX
base_controller:
  name: xrp
  description: 'SparkFun XRP Kit: XRP Controller (RP2350B + RM2), 2WD, LSM6DSOX'
  mcu: xrp
  board: sparkfun_xrp_controller
  driver_type: DRV8411A
  transport: serial
  serial_port: /dev/ttyACM0
  baudrate: 921600
  lidar:
    model: ld19
    comm_mode: serial
    serial_port: /dev/ttyUSB0
    baudrate: 230400
  sensors:
    imu: LSM6DSOX
    mag: NONE
    use_sim_imu: false
    use_sim_mag: false
    use_sim_wheel: false
    use_sim_ld19: false
    use_sim_env: false
    use_sim_sonar: false
    use_sim_battery: false
    current: NONE
    env: NONE
  simulation:
    map_width: 10.0
    map_height: 6.0
    wall_obstacle: true
    wall_x1: 2.0
    wall_y1: -1.5
    wall_x2: 2.0
    wall_y2: 1.5
    robot_mass: 0.8
    wheel_noise_rpm: 1.0
    gear_efficiency: 0.75
    gear_drag_rpm: 12.0
    battery_sag: 0.25
    battery_sag_tau_ms: 400.0
    driver_drop: 0.03
    driver_resistance: 0.1
    motor_stall_amps: 0.75
    driver_current_limit: 0.0
    imu_mount_roll_deg: 0.0
    imu_mount_pitch_deg: 0.0
  pins:
    motor1:
      pwm: -1
      in_a: 35
      in_b: 34
      invert: false
    encoder1:
      pin_a: 30
      pin_b: 31
      invert: true
    motor2:
      pwm: -1
      in_a: 32
      in_b: 33
      invert: false
    encoder2:
      pin_a: 24
      pin_b: 25
      invert: false
    motor3:
      pwm: -1
      in_a: -1
      in_b: -1
      invert: false
    encoder3:
      pin_a: -1
      pin_b: -1
      invert: false
    motor4:
      pwm: -1
      in_a: -1
      in_b: -1
      invert: false
    encoder4:
      pin_a: -1
      pin_b: -1
      invert: false
    i2c:
      sda: 38
      scl: 39
    led: 64
    battery:
      pin: 46
      r1: 100000
      r2: 33000
    sonar:
      trigger: 0
      echo: 1
  wifi:
    enabled: true
  telemetry:
    syslog: true
    ota: true
    ota_port: 3232
kinematics:
  base_type: 2wd
  wheel_diameter: 0.06
  lr_wheels_distance: 0.155
  max_rpm: 140
  max_rpm_ratio: 0.8
  counts_per_rev: 585
  pwm_bits: 10
  pwm_frequency: 20000
  motor_operating_voltage: 6
  motor_power_max_voltage: 6
  pid:
    kp: 1.0
    ki: 0.5
    kd: 0.1
  stamped_cmd_vel: auto
  fr_wheels_distance: 0
geometry: {}
ekf:
  ekf_filter_node:
    ros__parameters:
      frequency: 50.0
      two_d_mode: true
      publish_tf: true
      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: odom
      odom0: odom/unfiltered
      odom0_config:
      - false
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - false
      - false
      - false
      - true
      - false
      - false
      - false
      imu0: imu/data
      imu0_config:
      - false
      - false
      - false
      - false
      - false
      - true
      - false
      - false
      - false
      - false
      - false
      - true
      - true
      - true
      - false
slam:
  # A scan that sees less than 270 deg -- a depth camera (~87), a masked LiDAR --
  # takes these over slam_toolbox's values below (slam.launch.py). Matching is held
  # hard to the odometry and only strong loop closures count: with ~90 deg of wall
  # the matcher rotated maps that odometry had right. Replayed on recorded camera
  # runs, max position / max yaw error against the true pose (2026-10-03):
  #   camera mecanum 3.33 m / 30.0 deg -> 0.21 m / 2.5 deg
  #   camera skid    4.06 m / 38.9 deg -> 0.15 m / 2.1 deg
  # A 360 deg LiDAR keeps slam_toolbox's defaults: on the 1280 m2 warehouse the
  # same values cost 1.9 m (lyrical replay) and two live maps came out rotated 1 deg.
  # Strong closures still let a false one through in the rooms world: a 2.4-3.3 m
  # jump, all translation, to a look-alike room inside slam_toolbox's 3.0 m loop
  # search, after which home sat behind a wall (gate, 2026-10-03, three camera
  # legs). Replayed, a 2.0 m search took the camera skid run from 2.68 m to 0.20 m.
  narrow_fov_overrides:
    angle_variance_penalty: 0.02
    minimum_angle_penalty: 0.3
    distance_variance_penalty: 0.1
    minimum_distance_penalty: 0.3
    loop_match_minimum_response_coarse: 0.6
    loop_match_minimum_response_fine: 0.7
    loop_match_minimum_chain_size: 15
    loop_search_maximum_distance: 2.0
  slam_toolbox:
    ros__parameters:
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None
      odom_frame: odom
      map_frame: map
      base_frame: base_link
      scan_topic: /scan
      mode: mapping
      debug_logging: false
      throttle_scans: 1
      transform_publish_period: 0.02
      restamp_tf: true
      map_update_interval: 5.0
      resolution: 0.05
      max_laser_range: 10.0
      minimum_time_interval: 0.5
      transform_timeout: 0.2
      tf_buffer_duration: 30.0
      stack_size_to_use: 40000000
      enable_interactive_mode: true
      use_scan_matching: true
      use_scan_barycenter: true
      minimum_travel_distance: 0.5
      minimum_travel_heading: 0.5
      check_min_dist_and_heading_precisely: true
      scan_buffer_size: 10
      scan_buffer_maximum_scan_distance: 10.0
      link_match_minimum_response_fine: 0.1
      link_scan_maximum_distance: 1.5
      loop_search_maximum_distance: 3.0
      do_loop_closing: true
      loop_match_minimum_chain_size: 10
      loop_match_maximum_variance_coarse: 3.0
      loop_match_minimum_response_coarse: 0.35
      loop_match_minimum_response_fine: 0.45
      correlation_search_space_dimension: 0.5
      correlation_search_space_resolution: 0.01
      correlation_search_space_smear_deviation: 0.1
      # How far one loop closure may move the map: the matcher searches this square
      # around the candidate (slam_toolbox's 8.0 is +-4 m). The rooms world repeats
      # every ~2.9 m and closures matched the next room over: 2.4-3.3 m jumps, all
      # translation, then home sat behind a wall (gate 2026-10-03/04, LiDAR and camera
      # alike; a 2.0 m candidate radius still let a 2.76 m one through). 3.0 (+-1.5 m)
      # cannot reach the next room. Replayed: the camera run that jumped 3.04 m held
      # 0.17 m, as with loop closing off; on the 1280 m2 warehouse LiDAR replay it
      # matched the default (jazzy 0.21 m worst either way, lyrical 0.33 vs 0.34 m).
      loop_search_space_dimension: 3.0
      loop_search_space_resolution: 0.05
      loop_search_space_smear_deviation: 0.03
      distance_variance_penalty: 0.5
      angle_variance_penalty: 1.0
      fine_search_angle_offset: 0.00349
      coarse_search_angle_offset: 0.349
      coarse_angle_resolution: 0.0349
      minimum_angle_penalty: 0.9
      minimum_distance_penalty: 0.5
      use_response_expansion: true
nav2:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      odom_topic: /odom
      bt_loop_duration: 10
      # 20 ms is Nav2's own default and it is how long a BT action node waits for
      # a server to ACKNOWLEDGE a goal -- not to do the work. On a loaded bench a
      # 20 ms hiccup in controller_server therefore aborts the whole navigation
      # with error_code=107 'Behavior Tree action client timed out waiting.', and
      # the leg is scored as a navigation failure with the robot untouched at home
      # (traversed 0.001 m). Measured twice in 261 rounds of the 2026-09-24 soak
      # (rounds 157 and 258), both on follow_path:
      #
      #   Begin navigating from current location (0.20, -0.21) to (3.00, 0.00)
      #   Timed out while waiting for action server to acknowledge goal request
      #     for follow_path
      #   goalCompleted error 107: Behavior Tree action client timed out waiting..
      #
      # ~0.8% of legs. That is small in a soak and NOT small in a gate: over 30
      # legs it is better than a one-in-five chance of a spurious red per matrix,
      # which is a plausible share of this project's unexplained gate flakiness.
      # 200 ms costs nothing real -- it delays noticing a genuinely dead server by
      # 180 ms, and a server that never appears is caught by
      # wait_for_service_timeout below, not by this.
      default_server_timeout: 200
      wait_for_service_timeout: 30000
      action_server_result_timeout: 900.0
      navigators:
      - navigate_to_pose
      - navigate_through_poses
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      error_code_names:
      - compute_path_error_code
      - follow_path_error_code
  controller_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      controller_frequency: 20.0
      costmap_update_timeout: 0.3
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins:
      - progress_checker
      goal_checker_plugins:
      - general_goal_checker
      controller_plugins:
      - FollowPath
      use_realtime_priority: false
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: true
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.35
        yaw_goal_tolerance: 0.35
      FollowPath:
        plugin: nav2_rotation_shim_controller::RotationShimController
        transform_tolerance: 0.3
        primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        angular_dist_threshold: 0.785
        angular_disengage_threshold: 0.3925
        forward_sampling_distance: 0.5
        rotate_to_heading_angular_vel: 1.1
        max_angular_accel: 1.65
        simulate_ahead_time: 1.0
        rotate_to_goal_heading: false
        rotate_to_heading_once: true
        use_path_orientations: false
        desired_linear_vel: 0.16
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins:
      - GridBased
      costmap_update_timeout: 1.0
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.5
        use_astar: false
        allow_unknown: true
  smoother_server:
    ros__parameters:
      smoother_plugins:
      - simple_smoother
      simple_smoother:
        plugin: nav2_smoother::SimpleSmoother
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: true
  behavior_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      wait:
        plugin: nav2_behaviors::Wait
      local_frame: odom
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.88
      min_rotational_vel: 0.44
      rotational_acc_lim: 3.3
  velocity_smoother:
    ros__parameters:
      enable_stamped_cmd_vel: false
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: OPEN_LOOP
      max_velocity:
      - 0.19
      - 0.0
      - 1.32
      min_velocity:
      - -0.19
      - 0.0
      - -1.32
      max_accel:
      - 0.88
      - 0.0
      - 1.65
      max_decel:
      - -0.88
      - 0.0
      - -1.65
      odom_topic: odom
      odom_duration: 0.1
      deadband_velocity:
      - 0.0
      - 0.0
      - 0.0
      velocity_timeout: 1.0
  collision_monitor:
    ros__parameters:
      enable_stamped_cmd_vel: false
      base_frame_id: base_link
      odom_frame_id: odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 1.0
      base_shift_correction: true
      stop_pub_timeout: 2.0
      polygons:
      - FootprintApproach
      FootprintApproach:
        type: polygon
        action_type: approach
        footprint_topic: /local_costmap/published_footprint
        time_before_collision: 1.2
        simulation_time_step: 0.1
        min_points: 6
        visualize: false
        enabled: true
      observation_sources:
      - scan
      - sonar
      scan:
        type: scan
        topic: scan
        min_height: 0.15
        max_height: 2.0
        enabled: true
      # The second obstacle input, and the only reference config that may ask
      # for it: base_controller.pins.sonar above names a real HC-SR04 (GP0 /
      # GP1). The launcher drops this source on a robot whose pins read -1,
      # because a collision_monitor source that never publishes does not
      # degrade -- it stops the robot, which is right for a sensor that died
      # and wrong for one that was never fitted.
      #
      # One point per degree across the firmware's 30 degree cone, so 31
      # points, well inside the monitor's ceiling.
      sonar:
        type: range
        topic: sonar
        obstacles_angle: 0.0175
        enabled: true
  docking_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      controller_frequency: 20.0
      initial_perception_timeout: 5.0
      wait_charge_timeout: 5.0
      dock_approach_timeout: 30.0
      undock_linear_tolerance: 0.05
      undock_angular_tolerance: 0.1
      max_retries: 3
      base_frame: base_link
      fixed_frame: odom
      dock_backwards: false
      dock_prestaging_tolerance: 0.5
      dock_plugins:
      - simple_charging_dock
      simple_charging_dock:
        plugin: opennav_docking::SimpleChargingDock
        docking_threshold: 0.05
        staging_x_offset: -0.7
        use_external_detection_pose: true
        use_battery_status: false
        use_stall_detection: false
  waypoint_follower:
    ros__parameters:
      loop_rate: 20
      stop_on_failure: false
      action_server_result_timeout: 900.0
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        enabled: true
        waypoint_pause_duration: 200
  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        transform_tolerance: 0.5
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.26
        plugins:
        - voxel_layer
        - inflation_layer
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: 0.7
        voxel_layer:
          plugin: nav2_costmap_2d::VoxelLayer
          enabled: true
          publish_voxel_map: true
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        transform_tolerance: 1.0
        robot_radius: 0.26
        resolution: 0.05
        track_unknown_space: true
        plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 3.0
          inflation_radius: 0.7
        always_send_full_costmap: true
