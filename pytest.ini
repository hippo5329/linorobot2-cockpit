[pytest]
# Collect from tests/ only.
#
# Without this, `pytest` at the repo root also walks scripts/, where
# test_nav2_goal.py is a NODE, not a test -- it is named that way because it is
# the Nav2 goal test the bench runs, and it imports rclpy at module scope. On a
# desk with no ROS 2 it calls sys.exit(1) during collection, which pytest
# reports as INTERNALERROR and then stops: "no tests ran in 0.02s". Every test
# in tests/ is skipped, and nothing says the suite did not run. CI has always
# passed `tests` explicitly, so only a human or an agent typing the obvious
# command met it -- which is the worst audience for a silent no-op.
#
# An explicit path still wins over this, so `pytest tests/api` is unaffected.
testpaths = tests
