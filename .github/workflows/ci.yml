name: CI

on:
  push:
    branches: [main, dev, 'rc-*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main, dev, 'rc-*']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python syntax, config schema, header generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - name: Syntax
        run: python3 -m py_compile scripts/*.py launchers/*.py web/backend/*.py
      - name: Unit tests (env block, header generator, access policy, yaml merge)
        run: python3 -m pytest -q tests
      - name: Frontend syntax
        run: node --check web/frontend/app.js && node --check web/frontend/rosviz.js && node --check web/frontend/webserial.js
      - name: Reference configs are one-robot-per-file
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          python3 scripts/cockpit_paths.py --ensure
          # The script's exit code is the answer: 0 clean, 1 when a shipped
          # config would still be changed by the migration. (This used to grep
          # the output for "would", which matches its own "0 file(s) would be
          # changed." summary, so the step could never pass.)
          python3 scripts/migrate_config_schema.py --dry-run
      - name: Every reference config generates a header and an env block
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          for cfg in config/reference/*_config.yaml; do
            python3 scripts/gen_firmware_header.py --params "$cfg" --distro jazzy
            python3 scripts/mcu_env.py build --params "$cfg" --out /tmp/env.bin
          done

  firmware:
    name: Firmware ${{ matrix.env }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # esp32_lyrical is withdrawn while it does not fit the classic
        # ESP32's DRAM (overflowed by 14504 bytes, unchanged at transport MTU
        # 1024/768/512). Leaving it here would mean a permanently red main and
        # no release, which teaches everyone to ignore the light. See the
        # release workflow's matrix for the same note.
        env: [esp32, esp32s3, pico, pico2, picow, pico2w,
              esp32s3_lyrical, pico_lyrical, pico2_lyrical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/common/platformio_base.ini', 'firmware/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install --upgrade platformio pyyaml
      - name: Generate the header for the reference robot of this env
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          case "${{ matrix.env }}" in
            esp32*)  cfg=config/reference/esp32_wifi_config.yaml ;;
            pico2w*) cfg=config/reference/pico2w_config.yaml ;;
            picow*)  cfg=config/reference/picow_config.yaml ;;
            pico2*)  cfg=config/reference/rover_pico2_config.yaml ;;
            pico*)   cfg=config/reference/pico_config.yaml ;;
          esac
          distro=jazzy; case "${{ matrix.env }}" in *_lyrical) distro=lyrical ;; esac
          python3 scripts/gen_firmware_header.py --params "$cfg" --distro "$distro" --no-embed-secrets
      - name: Build (never `pio run -t upload`)
        run: pio run -d firmware -e ${{ matrix.env }}
      # A real LiDAR forwarded over UDP is `USE_LIDAR_UDP` WITHOUT
      # `USE_FAKE_LD19`, which is the whole of lidar.cpp -- and no reference
      # config produces that combination, so nothing here had ever compiled the
      # file. It is a supported path (the LD19 driver was forked for it), and a
      # guard added to its UART callback in d398f9a would have gone unbuilt.
      # One extra link on one env, from a throwaway variant of the same config.
      - name: Also build the real-LiDAR-over-UDP path (lidar.cpp)
        if: matrix.env == 'esp32'
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          sed 's/use_fake_ld19: *true/use_fake_ld19: false/' \
            config/reference/esp32_wifi_config.yaml > "$RUNNER_TEMP/udp_real.yaml"
          python3 scripts/gen_firmware_header.py --params "$RUNNER_TEMP/udp_real.yaml" \
            --distro jazzy --no-embed-secrets
          grep -q 'define USE_LIDAR_UDP' firmware/include/custom/lino_base_config.h
          ! grep -q 'define USE_FAKE_LD19' firmware/include/custom/lino_base_config.h
          pio run -d firmware -e esp32

  ros2:
    name: ROS 2 package and launch files (jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-yaml \
            ros-jazzy-nav2-bringup ros-jazzy-slam-toolbox ros-jazzy-robot-localization \
            ros-jazzy-imu-tools ros-jazzy-robot-state-publisher \
            ros-jazzy-rosbridge-server
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # The workspace must live OUTSIDE the checkout: `cp -r . ws/src/...` with
          # ws inside the repo is a copy of a directory into itself and GNU cp refuses.
          mkdir -p "$RUNNER_TEMP/ws/src"
          cp -r . "$RUNNER_TEMP/ws/src/linorobot2_cockpit"
          cd "$RUNNER_TEMP/ws" && colcon build --symlink-install --packages-select linorobot2_cockpit
      - name: Launch descriptions parse
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash && source "$RUNNER_TEMP/ws/install/setup.bash"
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          # The option goes BEFORE the package, never between the launch file and
          # its arguments: `ros2 launch <pkg> <file> --print-description distro:=jazzy`
          # splits the positional list and argparse rejects the argument it no
          # longer recognises -- `ros2: error: unrecognized arguments: distro:=jazzy`,
          # exit 2, with the description of the PREVIOUS launch file already printed
          # so the step looks like it got further than it did.
          ros2 launch --print-description linorobot2_cockpit bringup.launch.py
          ros2 launch --print-description linorobot2_cockpit slam.launch.py
          ros2 launch --print-description linorobot2_cockpit nav2.launch.py distro:=jazzy
          ros2 launch --print-description linorobot2_cockpit nav2.launch.py distro:=lyrical
          python3 scripts/test_nav2_goal.py --help
      - name: Nav2 parameter adaptation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          python3 scripts/verify_nav2_params.py
