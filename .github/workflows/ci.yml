name: CI

on:
  push:
    branches: [main, dev, 'rc-*']
  pull_request:
    branches: [main, dev, 'rc-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PEP 668 marks the distro interpreter externally managed, and the jobs here
  # no longer run actions/setup-python (it downloaded the interpreter on every
  # job). Our own pip calls pass --break-system-packages, but
  # micro_ros_platformio shells out to `/usr/bin/python3 -m pip install
  # catkin-pkg` from inside the PlatformIO build, where no flag of ours
  # reaches it -- that is what failed the pico2w firmware job. pip reads this
  # env var for the same effect. Safe: every one of these runs is a
  # throwaway container.
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  checks:
    name: Python syntax, config schema, header generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python. Ubuntu 24.04 already ships the 3.12 we pin, on
      # GitHub's runner and in the act image alike, and on a self-hosted runner
      # with no tool cache setup-python DOWNLOADS the interpreter from GitHub --
      # measured at 11m30s, per job, on every job. The firmware matrix is eight
      # jobs. --break-system-packages is what PEP 668 needs to pip into the
      # system interpreter, which is fine in a throwaway CI container.
      - run: pip install --break-system-packages pyyaml pytest
      - name: Syntax
        run: python3 -m py_compile scripts/*.py launchers/*.py web/backend/*.py
      - name: Unit tests (env block, header generator, access policy, yaml merge)
        run: python3 -m pytest -q tests
      - name: Frontend syntax
        run: node --check web/frontend/app.js && node --check web/frontend/rosviz.js && node --check web/frontend/webserial.js
      - name: Reference configs are one-robot-per-file
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          python3 scripts/cockpit_paths.py --ensure
          # The script's exit code is the answer: 0 clean, 1 when a shipped
          # config would still be changed by the migration. (This used to grep
          # the output for "would", which matches its own "0 file(s) would be
          # changed." summary, so the step could never pass.)
          python3 scripts/migrate_config_schema.py --dry-run
      - name: Every reference config generates a header and an env block
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          for cfg in config/reference/*_config.yaml; do
            python3 scripts/gen_firmware_header.py --params "$cfg" --distro jazzy
            python3 scripts/mcu_env.py build --params "$cfg" --out /tmp/env.bin
          done

  cockpit-api:
    name: The cockpit's HTTP API, headless
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python. Ubuntu 24.04 already ships the 3.12 we pin, on
      # GitHub's runner and in the act image alike, and on a self-hosted runner
      # with no tool cache setup-python DOWNLOADS the interpreter from GitHub --
      # measured at 11m30s, per job, on every job. The firmware matrix is eight
      # jobs. --break-system-packages is what PEP 668 needs to pip into the
      # system interpreter, which is fine in a throwaway CI container.
      # pyserial too: main.py imports it, and its apt fallback installs
      # python3-serial into the SYSTEM interpreter, which setup-python's
      # tool-cache Python cannot see. That mismatch is what sent the first
      # run of this job into the dependency loop.
      - run: pip install --break-system-packages pyyaml pytest fastapi uvicorn pyserial
      # The web UI is a different code path from the pipeline, and it is the
      # one users touch. Every defect the 2026-09-19 UI pass found was
      # server-side -- the header generator, the prebuilt cache swap, the flash
      # stamp -- and none of them could be reached by calling
      # one_click_pipeline.py, because the pipeline is the writer that wins.
      #
      # The backend needs no ROS and no board: it imports with fastapi,
      # uvicorn and pyyaml alone, and seeds a config directory from
      # config/reference on first run. So the whole API is testable here, in
      # seconds, with no hardware and no browser.
      - name: Start the cockpit on a scratch config directory
        run: |
          set -euo pipefail
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cockpit-cfg"
          export COCKPIT_PORT=18099
          python3 web/backend/main.py > "$RUNNER_TEMP/cockpit.log" 2>&1 &
          # Its own pid, kept for the stop step. Never hunt for it with a
          # pattern: `pgrep -f web/backend/main.py` also matches the cockpits
          # running in any other container on the same machine.
          echo $! > "$RUNNER_TEMP/cockpit.pid"
          for i in $(seq 1 30); do
            curl -sf -m 2 -o /dev/null http://127.0.0.1:18099/ && break
            sleep 1
          done
          curl -sf -m 5 -o /dev/null http://127.0.0.1:18099/
      - name: API suite
        run: |
          export COCKPIT_URL=http://127.0.0.1:18099
          export COCKPIT_TOKEN="$(cat "$RUNNER_TEMP/cockpit-cfg/.cockpit_token")"
          python3 -m pytest tests/api -v
      - name: The cockpit log must carry no traceback
        if: always()
        run: |
          if grep -q "Traceback (most recent call last)" "$RUNNER_TEMP/cockpit.log"; then
            echo "::error::the backend logged a traceback while serving the API suite"
            cat "$RUNNER_TEMP/cockpit.log"
            exit 1
          fi
          tail -20 "$RUNNER_TEMP/cockpit.log" || true
      - name: Stop the cockpit
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/cockpit.pid")" 2>/dev/null || true

  image:
    name: Robot image (jazzy) and its ROS workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage the sibling ROS package (LD19 driver)
        run: bash scripts/prepare_docker_vendor.sh
      # buildkit runs in its own container, so neither the host's
      # registries.conf nor the job container's environment reaches it: this
      # job was the one place in CI that still went to Docker Hub directly,
      # and under a full matrix its DNS lookup for registry-1.docker.io timed
      # out and failed the build. A self-hosted runner can name a
      # pull-through cache in REGISTRY_MIRROR; where it is unset (GitHub) the
      # config is empty and setup-buildx-action skips it, so the job is
      # unchanged there.
      - name: Point buildkit at the registry cache, where there is one
        id: buildkitd
        run: |
          if [ -z "${REGISTRY_MIRROR:-}" ]; then
            echo "config=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          host=${REGISTRY_MIRROR#*://}
          {
            echo "config<<BUILDKITD_EOF"
            echo "[registry.\"docker.io\"]"
            echo "  mirrors = [\"$host\"]"
            echo "[registry.\"$host\"]"
            echo "  http = true"
            echo "BUILDKITD_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "buildkit will pull docker.io through $host"
      - uses: docker/setup-buildx-action@v3
        with:
          # buildkit gets the host's network stack instead of a NAT'd bridge
          # of its own. This is the only step in CI that lands a container on
          # a nested bridge, so it is the only one that fails when that
          # bridge has no egress -- which, on a rootless container runtime,
          # depends on which interface the network namespace happened to be
          # built around. It surfaced first as a DNS timeout and then, once a
          # mirror was configured, as "connect: network is unreachable". Host
          # networking removes the dependency, and is one NAT hop less on a
          # hosted runner too.
          driver-opts: network=host
          buildkitd-config-inline: ${{ steps.buildkitd.outputs.config }}
      # Build only -- no push, no registry credentials. The point is that the
      # image is built at all on a CLEAN checkout: rc-20260919 shipped a
      # half-built ROS workspace on both distros because CMakeLists.txt
      # installed the gitignored maps/, which exists in a developer tree and
      # not here, and nothing between that error and the release ever looked
      # at the image. The Dockerfile now asserts the overlay itself; this job
      # is what makes those assertions run before a tag rather than during it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            ROS_DISTRO=jazzy
          cache-from: type=gha,scope=robot-jazzy
          cache-to: type=gha,mode=max,scope=robot-ci-jazzy

  firmware:
    name: Firmware ${{ matrix.env }}
    runs-on: ubuntu-24.04
    # A wedged download, not a slow build. `pio run` sat for 19 minutes at 0%
    # CPU, blocked in read() on an ESTABLISHED socket to 185.199.109.133 with
    # both queues empty -- a dead connection to GitHub's asset CDN that
    # PlatformIO gives no read timeout. Ten of these held runner slots until
    # act_runner's 3h ceiling. A job that has stopped making progress should
    # go red and free the slot; a real build of the slowest env is ~6 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Ten of these at once is what stalls them. Each env's first build clones
      # the arduino-pico framework and its ~40 submodules from GitHub, and ten
      # simultaneous clone storms get throttled into connections that never
      # return: `pio run` blocked in read() at 0% CPU, both socket queues empty,
      # until timeout-minutes. One env that got through on its own went green.
      # Four waves of builds still finish well inside the ceiling, and once each
      # env's actions/cache entry is warm there is nothing left to clone.
      # A hosted runner never sees this -- it gets one job's worth of bandwidth.
      max-parallel: 4
      matrix:
        # esp32_lyrical is back: it links at 116308 of the classic ESP32's
        # 124580-byte dram0_0_seg (93.4%) rather than overflowing it by 14504.
        # This env is the tightest in the matrix by a wide margin, so it is
        # also the one that will go red first if anyone adds a publisher or a
        # global -- which is the point of having it here. See the release
        # workflow's matrix for what closed the gap.
        # The RP2 half is the W envs now, and they are what the releases ship.
        # A Pico W is an RP2040 and a Pico 2 W is an RP2350, so a W image runs
        # on a non-W board -- verified on a plain Pico 2 on 2026-09-20: the
        # radio is compiled in but nothing touches the CYW43 unless Wi-Fi is
        # wanted AND an AP list exists. The non-W envs stay in the matrix so
        # they keep compiling, but nothing is built from them.
        env: [esp32, esp32s3, pico, pico2, picow, pico2w,
              esp32_lyrical, esp32s3_lyrical, picow_lyrical, pico2w_lyrical]
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python. Ubuntu 24.04 already ships the 3.12 we pin, on
      # GitHub's runner and in the act image alike, and on a self-hosted runner
      # with no tool cache setup-python DOWNLOADS the interpreter from GitHub --
      # measured at 11m30s, per job, on every job. The firmware matrix is eight
      # jobs. --break-system-packages is what PEP 668 needs to pip into the
      # system interpreter, which is fine in a throwaway CI container.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/common/platformio_base.ini', 'firmware/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      # micro_ros_platformio builds the micro-ROS library with colcon, which
      # needs cmake. GitHub's ubuntu-24.04 image ships it; a bare container
      # image need not, and `pio run` then dies four minutes in with
      # "RuntimeError: Could not find 'cmake' executable" -- inside the
      # PlatformIO build, where it reads as a firmware fault rather than a
      # missing tool. Installed only when absent, so this is a no-op on
      # GitHub. git is told to give up on a stalled clone rather than hang:
      # the arduino-pico framework pulls some forty submodules, and a dead
      # connection with no timeout held whole jobs at 0% CPU until the
      # runner's ceiling.
      - name: Tools the hosted image has and a container image may not
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            [ -n "${APT_PROXY:-}" ] && echo "Acquire::http::Proxy \"$APT_PROXY\";" | sudo tee /etc/apt/apt.conf.d/01proxy >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends cmake
          fi
          cmake --version | head -1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
      - run: pip install --break-system-packages --upgrade platformio pyyaml
      # A self-hosted build host usually already has these packages from earlier
      # builds -- 4.4 GB: both platforms, every toolchain and framework. A job
      # container starts with an empty core dir and downloads them again, and
      # that download is the one that stalls: the arduino-pico framework plus
      # some forty submodules, from GitHub, several jobs at once.
      #
      # So copy, rather than share. The job gets its OWN writable core dir, so
      # concurrent builds never touch each other's PlatformIO state, and it
      # fetches nothing. (PLATFORMIO_PACKAGES_DIR could point straight at the
      # mount, but a read-only packages dir is not a mode PlatformIO promises,
      # and it would couple every running job to one directory.)
      #
      # Where no such mount exists -- GitHub -- this does nothing at all and
      # the actions/cache entry above stays the mechanism.
      - name: Seed PlatformIO from the runner's own cache, when there is one
        run: |
          src="${PIO_CACHE_DIR:-/pio-host}"
          if [ -d "$src/packages" ]; then
            mkdir -p ~/.platformio
            cp -a "$src/packages" "$src/platforms" ~/.platformio/
            echo "seeded $(du -sh ~/.platformio/packages | cut -f1) from $src"
          else
            echo "no runner cache at $src; PlatformIO will download what it needs"
          fi
      - name: Generate the header for the reference robot of this env
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          case "${{ matrix.env }}" in
            # Both ESP32 envs build from the GenDrv reference. The DevKit
            # pair (esp32_config / esp32_wifi_config) was deleted on
            # 2026-09-20: they described the same silicon as gendrv and
            # differed only in keys the env partition decides at boot --
            # transport, lidar_comm, wifi, the fake flags.
            esp32*)  cfg=config/reference/gendrv_config.yaml ;;
            # Every RP2 env -- pico, picow, pico2, pico2w and their _lyrical
            # twins -- builds from the one mecanum reference. The header is
            # identical across the family; the env name picks the board. The
            # W-specific facts (LED on the CYW43, GP23/24/25/29 owned by the
            # radio) live in scripts/pin_catalog.py, keyed on the mcu name.
            pico*)   cfg=config/reference/pico2_mecanum_config.yaml ;;
          esac
          distro=jazzy; case "${{ matrix.env }}" in *_lyrical) distro=lyrical ;; esac
          python3 scripts/gen_firmware_header.py --params "$cfg" --distro "$distro" --no-embed-secrets
      - name: Build (never `pio run -t upload`)
        run: pio run -d firmware -e ${{ matrix.env }}
      # A real LiDAR forwarded over UDP is `USE_LIDAR_UDP` WITHOUT
      # `USE_FAKE_LD19`, which is the whole of lidar.cpp -- and no reference
      # config produces that combination, so nothing here had ever compiled the
      # file. It is a supported path (the LD19 driver was forked for it), and a
      # guard added to its UART callback in d398f9a would have gone unbuilt.
      # One extra link on one env, from a throwaway variant of the same config.
      - name: Also build the real-LiDAR-over-UDP path (lidar.cpp)
        if: matrix.env == 'esp32'
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          sed 's/comm_mode: *serial/comm_mode: udp/' \
            config/reference/gendrv_config.yaml > "$RUNNER_TEMP/udp_real.yaml"
          python3 scripts/gen_firmware_header.py --params "$RUNNER_TEMP/udp_real.yaml" \
            --distro jazzy --no-embed-secrets
          grep -q 'define USE_LIDAR_UDP' firmware/include/custom/lino_base_config.h
          ! grep -q 'define USE_FAKE_LD19' firmware/include/custom/lino_base_config.h
          pio run -d firmware -e esp32

  ros2:
    name: ROS 2 package and launch files (jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      # actions/checkout is a JavaScript action, so it needs node INSIDE the job
      # container. GitHub's hosted runner injects one; act_runner does not, and
      # ros:jazzy-ros-base has none -- the job died on
      #   crun: executable file `node` not found in $PATH ... exit code 127
      # before it had checked anything out. A shell step runs without node, so
      # this goes first; on GitHub node is already there and it is a no-op.
      - name: node for actions/checkout
        run: |
          if ! command -v node >/dev/null 2>&1; then
            [ -n "${APT_PROXY:-}" ] && echo "Acquire::http::Proxy \"$APT_PROXY\";" > /etc/apt/apt.conf.d/01proxy
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs
          fi
          node --version
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-yaml \
            ros-jazzy-nav2-bringup ros-jazzy-slam-toolbox ros-jazzy-robot-localization \
            ros-jazzy-imu-tools ros-jazzy-robot-state-publisher \
            ros-jazzy-rosbridge-server
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # The workspace must live OUTSIDE the checkout: `cp -r . ws/src/...` with
          # ws inside the repo is a copy of a directory into itself and GNU cp refuses.
          mkdir -p "$RUNNER_TEMP/ws/src"
          cp -r . "$RUNNER_TEMP/ws/src/linorobot2_cockpit"
          cd "$RUNNER_TEMP/ws" && colcon build --symlink-install --packages-select linorobot2_cockpit
      - name: Launch descriptions parse
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash && source "$RUNNER_TEMP/ws/install/setup.bash"
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          # The option goes BEFORE the package, never between the launch file and
          # its arguments: `ros2 launch <pkg> <file> --print-description distro:=jazzy`
          # splits the positional list and argparse rejects the argument it no
          # longer recognises -- `ros2: error: unrecognized arguments: distro:=jazzy`,
          # exit 2, with the description of the PREVIOUS launch file already printed
          # so the step looks like it got further than it did.
          ros2 launch --print-description linorobot2_cockpit bringup.launch.py
          ros2 launch --print-description linorobot2_cockpit slam.launch.py
          ros2 launch --print-description linorobot2_cockpit nav2.launch.py distro:=jazzy
          ros2 launch --print-description linorobot2_cockpit nav2.launch.py distro:=lyrical
          python3 scripts/test_nav2_goal.py --help
      - name: Nav2 parameter adaptation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          python3 scripts/verify_nav2_params.py
