# Release: prebuilt firmware for every board x distro as release assets, and
# the robot runtime + PlatformIO build images on Docker Hub.
#
# Triggered by a datestamped tag:
#   git tag 20260918 && git push origin 20260918        # release
#   git tag rc-20260918 && git push origin rc-20260918  # candidate (prerelease)
#
# workflow_dispatch rebuilds and republishes the IMAGES only, refreshing the
# floating tags (:jazzy, :lyrical, :latest) without touching firmware archives
# or creating a release. That is the button for "the registry lost something".
name: Release

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]', 'rc-*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Firmware archives are release assets, so they only make sense for a tag.
  # A workflow_dispatch is the "republish the images" button -- see the images
  # job -- and must not manufacture a GitHub release named after the branch.
  firmware:
    name: Prebuilt firmware ${{ matrix.profile }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # esp32-lyrical is back. It was withdrawn while lyrical's micro-ROS
        # did not fit the classic ESP32's DRAM -- `.dram0.bss will not fit in
        # region dram0_0_seg`, over by 14504 bytes, and by exactly 14504 at
        # transport MTU 1024, 768 and 512 alike, so the MTU was never the
        # lever. What closed it was sizing the entity pools to what the
        # firmware actually creates (firmware/esp32.meta), deleting dead tool
        # globals, and mapping the env partition instead of copying it into
        # .bss. This config now links at 116308 of the 124580-byte segment --
        # 93.4%, 8272 spare -- and has been run on a GenDrv against a lyrical
        # agent at 50 Hz. tests/test_microros_pools.py guards the pools; the
        # margin is thin enough that a new publisher needs a re-measure.
        profile: [pico2-jazzy, pico-jazzy, esp32-jazzy, esp32s3-jazzy,
                  pico2-lyrical, pico-lyrical, esp32-lyrical, esp32s3-lyrical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-release-${{ matrix.profile }}-${{ hashFiles('firmware/common/platformio_base.ini', 'firmware/platformio.ini') }}
      - run: pip install --upgrade platformio pyyaml
      - name: Build the image
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          python3 scripts/build_prebuilt.py ${{ matrix.profile }} --dist dist
      # The image must be built for its own distro's /cmd_vel contract, and this
      # is checked on the BYTES that are about to be attached rather than on the
      # header that produced them. nav2 1.4 (kilted) flipped TwistPublisher to
      # TwistStamped, so lyrical drives /cmd_vel stamped and jazzy drives it
      # plain; every reference config says `stamped_cmd_vel: auto` and
      # gen_firmware_header.py resolves that from --distro alone, falling back to
      # $ROS_DISTRO, which does not exist on this runner.
      #
      # Nothing downstream catches a mismatch. The image links, flashes,
      # enumerates with the agent and publishes odometry at 50 Hz; it simply never
      # receives a velocity command. rc-20260919 shipped all three of its lyrical
      # profiles that way and a full hardware release test passed them.
      - name: The image must speak this distro's /cmd_vel
        run: |
          set -euo pipefail
          # Not `ls a b | head -1`: an RP2 profile has no firmware.bin and an
          # ESP32 one has no firmware.uf2, so ls always exits 2 for the missing
          # one, and under `set -o pipefail` that fails the step for EVERY
          # profile regardless of what it found.
          img=""
          for f in firmware/prebuilt/${{ matrix.profile }}/firmware.uf2 \
                   firmware/prebuilt/${{ matrix.profile }}/firmware.bin; do
            [ -f "$f" ] && { img="$f"; break; }
          done
          test -n "$img" || { echo "::error::no firmware image for ${{ matrix.profile }}"; exit 1; }
          distro=$(python3 -c "import json;print(json.load(open('firmware/prebuilt/${{ matrix.profile }}/manifest.json'))['ros_distro'])")
          n=$(strings -a "$img" | grep -c TwistStamped || true)
          case "$distro" in
            humble|iron|jazzy) want=0 ;;
            *)                 want=1 ;;
          esac
          echo "profile=${{ matrix.profile }} distro=$distro TwistStamped strings=$n want>0=$want"
          if [ "$want" = 1 ] && [ "$n" -eq 0 ]; then
            echo "::error::${{ matrix.profile }} is built for $distro, which publishes /cmd_vel as TwistStamped, but the image contains no TwistStamped. It would enumerate and never move. Check that build_prebuilt.py passes --distro."
            exit 1
          fi
          if [ "$want" = 0 ] && [ "$n" -gt 0 ]; then
            echo "::error::${{ matrix.profile }} is built for $distro, which publishes /cmd_vel as plain Twist, but the image subscribes to TwistStamped."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: dist/linorobot2-firmware-${{ matrix.profile }}.tar.gz

  publish-firmware:
    name: Attach firmware to the release
    needs: firmware
    # always(), because `needs:` on its own SKIPS this job the moment one
    # profile fails -- and a skipped publish is silent. The run then shows a
    # row of green builds, no release, and nothing saying why; it has already
    # happened twice. Publish whatever built so the candidate is testable, then
    # fail the job with the reason named, so the gap cannot be missed either.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          # `pattern` is not optional: without it this downloads EVERY artifact of
          # the run, and docker/build-push-action's `*.dockerbuild` build records are
          # still being uploaded by the image jobs, which fails the whole download.
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: What actually built
        run: |
          ls -l dist/ || true
          found=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          echo "$found archive(s) to publish"
          # An empty release is worse than none: it looks published and gives a
          # user nothing to fetch.
          test "$found" -gt 0 || { echo "::error::no firmware archives were produced"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ startsWith(github.ref_name, 'rc-') }}
          generate_release_notes: true
      - name: The firmware matrix must have been green
        if: needs.firmware.result != 'success'
        run: |
          echo "::error::a firmware profile failed to build, so the release just \
          published is missing at least one archive (firmware job: ${{ needs.firmware.result }})"
          exit 1

  images:
    name: Docker image ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: robot-jazzy
            dockerfile: docker/Dockerfile
            image: linorobot2-cockpit-robot
            distro: jazzy
          - name: robot-lyrical
            dockerfile: docker/Dockerfile
            image: linorobot2-cockpit-robot
            distro: lyrical
          - name: pio
            dockerfile: docker/Dockerfile.pio
            image: linorobot2-cockpit-pio
            distro: ''
    steps:
      - uses: actions/checkout@v4
      - name: Stage the sibling ROS package (LD19 driver)
        if: matrix.distro != ''
        run: bash scripts/prepare_docker_vendor.sh
      - uses: docker/setup-buildx-action@v3
      # Docker Hub only. ghcr was the original home and is gone: the same blob
      # measured 86 KiB/s there against 10289 KiB/s on Docker Hub from the same
      # machine a minute apart -- 223 minutes versus 1.9 for the robot image --
      # and a mirror nobody should pull from is just another thing to keep in
      # step. Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token,
      # not the account password) in the repo secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          base="docker.io/$DOCKERHUB_USERNAME/${{ matrix.image }}"
          # The datestamped tag is only meaningful on a tag build. On a
          # workflow_dispatch the ref is a branch, and "robot:main-jazzy" would
          # be a tag nobody asked for that never gets cleaned up -- so a
          # dispatch refreshes only the floating tags.
          if [ -n "${{ matrix.distro }}" ]; then
            tags="$base:${{ matrix.distro }}"
            case "$GITHUB_REF" in refs/tags/*) tags="$base:${{ github.ref_name }}-${{ matrix.distro }},$tags" ;; esac
          else
            tags="$base:latest"
            case "$GITHUB_REF" in refs/tags/*) tags="$base:${{ github.ref_name }},$tags" ;; esac
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ROS_DISTRO=${{ matrix.distro || 'jazzy' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
