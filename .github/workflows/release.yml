# Release: prebuilt firmware for every board x distro as release assets, and
# the robot runtime + PlatformIO build images on Docker Hub.
#
# Triggered by a datestamped tag:
#   git tag 20260918 && git push origin 20260918        # release
#   git tag rc-20260918 && git push origin rc-20260918  # candidate (prerelease)
#
# workflow_dispatch rebuilds and republishes the IMAGES only, refreshing the
# floating tags (:jazzy, :lyrical, :latest) without touching firmware archives
# or creating a release. That is the button for "the registry lost something".
name: Release

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]', 'rc-*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Firmware archives are release assets, so they only make sense for a tag.
  # A workflow_dispatch is the "republish the images" button -- see the images
  # job -- and must not manufacture a GitHub release named after the branch.
  firmware:
    name: Prebuilt firmware ${{ matrix.profile }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # esp32-lyrical is back. It was withdrawn while lyrical's micro-ROS
        # did not fit the classic ESP32's DRAM -- `.dram0.bss will not fit in
        # region dram0_0_seg`, over by 14504 bytes, and by exactly 14504 at
        # transport MTU 1024, 768 and 512 alike, so the MTU was never the
        # lever. What closed it was sizing the entity pools to what the
        # firmware actually creates (firmware/esp32.meta), deleting dead tool
        # globals, and mapping the env partition instead of copying it into
        # .bss. This config now links at 116308 of the 124580-byte segment --
        # 93.4%, 8272 spare -- and has been run on a GenDrv against a lyrical
        # agent at 50 Hz. tests/test_microros_pools.py guards the pools; the
        # margin is thin enough that a new publisher needs a re-measure.
        profile: [pico2-jazzy, pico-jazzy, esp32-jazzy, esp32s3-jazzy,
                  pico2-lyrical, pico-lyrical, esp32-lyrical, esp32s3-lyrical]
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python. Ubuntu 24.04 already ships the 3.12 we pin, on
      # GitHub's runner and in the act image alike, and on a self-hosted runner
      # with no tool cache setup-python DOWNLOADS the interpreter from GitHub --
      # measured at 11m30s, per job, on every job. The firmware matrix is eight
      # jobs. --break-system-packages is what PEP 668 needs to pip into the
      # system interpreter, which is fine in a throwaway CI container.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: pio-release-${{ matrix.profile }}-${{ hashFiles('firmware/common/platformio_base.ini', 'firmware/platformio.ini') }}
      - run: pip install --break-system-packages --upgrade platformio pyyaml
      # A self-hosted build host usually already has these packages from earlier
      # builds -- 4.4 GB: both platforms, every toolchain and framework. A job
      # container starts with an empty core dir and downloads them again, and
      # that download is the one that stalls: the arduino-pico framework plus
      # some forty submodules, from GitHub, several jobs at once.
      #
      # So copy, rather than share. The job gets its OWN writable core dir, so
      # concurrent builds never touch each other's PlatformIO state, and it
      # fetches nothing. (PLATFORMIO_PACKAGES_DIR could point straight at the
      # mount, but a read-only packages dir is not a mode PlatformIO promises,
      # and it would couple every running job to one directory.)
      #
      # Where no such mount exists -- GitHub -- this does nothing at all and
      # the actions/cache entry above stays the mechanism.
      - name: Seed PlatformIO from the runner's own cache, when there is one
        run: |
          src="${PIO_CACHE_DIR:-/pio-host}"
          if [ -d "$src/packages" ]; then
            mkdir -p ~/.platformio
            cp -a "$src/packages" "$src/platforms" ~/.platformio/
            echo "seeded $(du -sh ~/.platformio/packages | cut -f1) from $src"
          else
            echo "no runner cache at $src; PlatformIO will download what it needs"
          fi
      - name: Build the image
        run: |
          export COCKPIT_CONFIG_DIR="$RUNNER_TEMP/cfg"
          python3 scripts/build_prebuilt.py ${{ matrix.profile }} --dist dist
      # The image must be built for its own distro's /cmd_vel contract, and this
      # is checked on the BYTES that are about to be attached rather than on the
      # header that produced them. nav2 1.4 (kilted) flipped TwistPublisher to
      # TwistStamped, so lyrical drives /cmd_vel stamped and jazzy drives it
      # plain. The board picks the type at run time, defaulting from the distro
      # the image was built for (board_microros_distro), which it carries as
      # the string FW_ROS_DISTRO=<distro>.
      #
      # Nothing downstream catches a mismatch. The image links, flashes,
      # enumerates with the agent and publishes odometry at 50 Hz; it simply never
      # receives a velocity command. rc-20260919 shipped all three of its lyrical
      # profiles that way and a full hardware release test passed them.
      - name: The image must speak this distro's /cmd_vel
        run: |
          set -euo pipefail
          # Not `ls a b | head -1`: an RP2 profile has no firmware.bin and an
          # ESP32 one has no firmware.uf2, so ls always exits 2 for the missing
          # one, and under `set -o pipefail` that fails the step for EVERY
          # profile regardless of what it found.
          img=""
          for f in firmware/prebuilt/${{ matrix.profile }}/firmware.uf2 \
                   firmware/prebuilt/${{ matrix.profile }}/firmware.bin; do
            [ -f "$f" ] && { img="$f"; break; }
          done
          test -n "$img" || { echo "::error::no firmware image for ${{ matrix.profile }}"; exit 1; }
          distro=$(python3 -c "import json;print(json.load(open('firmware/prebuilt/${{ matrix.profile }}/manifest.json'))['ros_distro'])")
          # The same function build_prebuilt.py ran, on the bytes this job attaches:
          # both types linked, and the image's distro stamp (its /cmd_vel default)
          # is this profile's. It reassembles a .uf2 first -- `strings` on the
          # file splits any string that crosses one of its 256-byte payloads.
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import build_prebuilt as b; b.check_cmd_vel_contract(sys.argv[1], sys.argv[2], sys.argv[3])" \
            "${{ matrix.profile }}" "$img" "$distro"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: dist/linorobot2-firmware-${{ matrix.profile }}.tar.gz

  publish-firmware:
    name: Attach firmware to the release
    needs: firmware
    # always(), because `needs:` on its own SKIPS this job the moment one
    # profile fails -- and a skipped publish is silent. The run then shows a
    # row of green builds, no release, and nothing saying why; it has already
    # happened twice. Publish whatever built so the candidate is testable, then
    # fail the job with the reason named, so the gap cannot be missed either.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          # `pattern` is not optional: without it this downloads EVERY artifact of
          # the run, and docker/build-push-action's `*.dockerbuild` build records are
          # still being uploaded by the image jobs, which fails the whole download.
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: What actually built
        run: |
          ls -l dist/ || true
          found=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          echo "$found archive(s) to publish"
          # An empty release is worse than none: it looks published and gives a
          # user nothing to fetch.
          test "$found" -gt 0 || { echo "::error::no firmware archives were produced"; exit 1; }
      # A candidate tag gets re-cut in place -- rc-20260919 was force-moved four
      # times in one day -- and action-gh-release only ADDS files. Anything the
      # previous cut published under a name this cut does not produce would sit
      # in the release forever, indistinguishable from a current artifact.
      #
      # That is not a tidiness concern. The cut that renamed the profiles from
      # `pico2` to `pico2-jazzy` would otherwise have left the OLD
      # linorobot2-firmware-pico2-lyrical.tar.gz in place: the image built
      # without --distro, which enumerates and never moves. The fix for a defect
      # would have shipped alongside the defect.
      - name: Drop firmware archives left by a previous cut of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repo out -- it only downloads artifacts --
          # so `gh` has no git remote to infer the repository from and every
          # call here failed with "could not determine what repo to use". The
          # first version sent that error to /dev/null and fell through to an
          # empty list, so the step printed nothing, deleted nothing, and looked
          # exactly like a release with no stale assets. Four cuts of
          # rc-20260919 went by with the pre-rename pico/pico2/esp32/esp32s3
          # archives still attached.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # A missing release is normal on the first cut of a tag; anything else
          # is a fault and must not be read as "nothing to prune".
          if ! gh release view "$tag" --json assets --jq '.assets[].name' > old.txt 2> err.txt; then
            if grep -qi 'release not found' err.txt; then
              echo "::notice::no existing release for $tag -- nothing to prune"
              : > old.txt
            else
              cat err.txt
              echo "::error::could not list the existing assets of $tag"
              exit 1
            fi
          fi
          while read -r name; do
            [ -n "$name" ] || continue
            case "$name" in linorobot2-firmware-*.tar.gz) ;; *) continue ;; esac
            if [ ! -f "dist/$name" ]; then
              echo "deleting stale asset $name"
              gh release delete-asset "$tag" "$name" --yes
            fi
          done < old.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ startsWith(github.ref_name, 'rc-') }}
          generate_release_notes: true
      - name: The firmware matrix must have been green
        if: needs.firmware.result != 'success'
        run: |
          echo "::error::a firmware profile failed to build, so the release just \
          published is missing at least one archive (firmware job: ${{ needs.firmware.result }})"
          exit 1

  images:
    # One build per architecture, each on a NATIVE runner, pushed by digest; the
    # images-manifest job below publishes the tags as one multi-arch list. arm64
    # is for the October robots (Raspberry Pi 5, Jetson Orin Nano). Native, not
    # QEMU: this Dockerfile compiles picotool, micro_ros_agent and the cockpit
    # workspace (and Nav2 when the archive lags), hours under emulation.
    # The pio image stays amd64: firmware is built on a host, never on a robot.
    name: Docker image ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: robot-jazzy
            dockerfile: docker/Dockerfile
            image: linorobot2-cockpit-robot
            distro: jazzy
            arch: amd64
            runner: ubuntu-24.04
          - name: robot-jazzy
            dockerfile: docker/Dockerfile
            image: linorobot2-cockpit-robot
            distro: jazzy
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: robot-lyrical
            dockerfile: docker/Dockerfile
            image: linorobot2-cockpit-robot
            distro: lyrical
            arch: amd64
            runner: ubuntu-24.04
          - name: robot-lyrical
            dockerfile: docker/Dockerfile
            image: linorobot2-cockpit-robot
            distro: lyrical
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: pio
            dockerfile: docker/Dockerfile.pio
            image: linorobot2-cockpit-pio
            distro: ''
            arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage the sibling ROS package (LD19 driver)
        if: matrix.distro != ''
        run: bash scripts/prepare_docker_vendor.sh
      - uses: docker/setup-buildx-action@v3
      # Docker Hub only. ghcr was the original home and is gone: the same blob
      # measured 86 KiB/s there against 10289 KiB/s on Docker Hub from the same
      # machine a minute apart -- 223 minutes versus 1.9 for the robot image --
      # and a mirror nobody should pull from is just another thing to keep in
      # step. Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token,
      # not the account password) in the repo secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ROS_DISTRO=${{ matrix.distro || 'jazzy' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images-manifest:
    # A tag is published only when EVERY architecture of that image built: a
    # half list would pull on one robot and fail on the next.
    name: Docker manifest ${{ matrix.name }}
    needs: images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: robot-jazzy, image: linorobot2-cockpit-robot, distro: jazzy}
          - {name: robot-lyrical, image: linorobot2-cockpit-robot, distro: lyrical}
          - {name: pio, image: linorobot2-cockpit-pio, distro: ''}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tags as one multi-arch list
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          base="docker.io/$DOCKERHUB_USERNAME/${{ matrix.image }}"
          # The datestamped tag is only meaningful on a tag build. On a
          # workflow_dispatch the ref is a branch, and "robot:main-jazzy" would
          # be a tag nobody asked for that never gets cleaned up -- so a
          # dispatch refreshes only the floating tags.
          if [ -n "${{ matrix.distro }}" ]; then
            tags="$base:${{ matrix.distro }}"
            case "$GITHUB_REF" in refs/tags/*) tags="$base:${{ github.ref_name }}-${{ matrix.distro }} $tags" ;; esac
          else
            tags="$base:latest"
            case "$GITHUB_REF" in refs/tags/*) tags="$base:${{ github.ref_name }} $tags" ;; esac
          fi
          cd "$RUNNER_TEMP/digests"
          docker buildx imagetools create $(printf -- '-t %s ' $tags) $(printf "$base@sha256:%s " *)
          for t in $tags; do docker buildx imagetools inspect "$t" | grep -E '^Name|Platform'; done
