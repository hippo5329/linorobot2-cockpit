# The linorobot2 firmware on the UNO Q MCU (Zephyr 4.4 + micro-ROS jazzy).
CONFIG_MICROROS=y
CONFIG_MICROROS_TRANSPORT_SERIAL=y
# The Arduino firmware's limits (firmware/atomic.meta): an Odometry message does not
# fit a 512-byte MTU, and a best-effort stream cannot fragment.
CONFIG_MICROROS_PUBLISHERS="10"
CONFIG_MICROROS_SUBSCRIBERS="2"
CONFIG_MICROROS_XRCE_DDS_MTU="1024"

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FPU=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_CRC=y
# test_sensors: the Qwiic bus (i2c4), A0, the chip's unique ID
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_HWINFO=y

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_THREAD_PRIORITY=3

# Zephyr 4.4: picolibc is the default C library; clock_gettime() comes from POSIX_TIMERS.
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_DEVICE_IO=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# The MCU's UART console (usart1, D0/D1) does not reach Linux. printk and the fatal-error
# report go to a RAM buffer instead, read over SWD:
#   openocd ... -c "init; halt; dump_image ram_console.bin <&ram_console_buf> 4096"
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
CONFIG_LOG_MODE_MINIMAL=y
# The UART console hooks printk after the RAM console and would take it back.
CONFIG_UART_CONSOLE=n

