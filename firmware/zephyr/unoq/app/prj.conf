# micro-ROS app for the UNO Q MCU on Zephyr 4.4 (the module sample targets 4.0/4.1).
CONFIG_GPIO=y
CONFIG_MICROROS=y
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_CPP=y

CONFIG_MAIN_STACK_SIZE=25000
CONFIG_MAIN_THREAD_PRIORITY=3

# Zephyr 4.4: picolibc is the default C library; PTHREAD_IPC and POSIX_CLOCK are gone,
# clock_gettime() now comes from POSIX_TIMERS.
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_POSIX_DEVICE_IO=y
