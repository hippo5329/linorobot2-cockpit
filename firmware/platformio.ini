[platformio]
extra_configs = common/platformio_base.ini
default_envs = esp32

[env:esp32]
extends = base_esp32
build_flags =
    ; `extends` does NOT merge build_flags -- redefining the key here REPLACES
    ; the base's, silently. base_esp32 carries the section-GC flags, so without
    ; this reference they would be dropped and the dead-code collection would
    ; simply not happen. [env:esp32s3] already does the same for its base.
    ${base_esp32.build_flags}
    -Iinclude
    -Icommon/lib/mcu_env
    -Icommon/lib/sensor_factory
    -Icommon/lib/uros_transport
    -Icommon/lib/hw_factory
    -Icommon/lib/board_init
    -Icommon/lib/i2c_probe
    -Icommon/lib/imu
    -DCONFIG_PATH=\"custom/lino_base_config.h\"
    -D __PGMSPACE_H_

; [env:esp32_wifi] is gone. It differed from [env:esp32] by exactly two build
; flags, and neither survives scrutiny: USE_WIFI was only ever defined and never
; read anywhere in the tree, and USE_STAY_CONNECTED -- which decides whether to
; ping the agent -- is now chosen at run time from the transport, because that is
; what it was always a proxy for. The transport itself comes from the env
; partition. One ESP32 board, one firmware.
;
; config/esp32_wifi_config.yaml now builds this same env.



[env:pico]
extends = base_pico
build_flags =
    -Iinclude
    ; %f prints NOTHING without this. The RP2 toolchain links
    ; newlib-nano, whose printf has no float conversion unless the
    ; linker is told to pull the real one in -- and it fails silently:
    ; the literal text of the format string appears and every number is
    ; simply absent. `test_sensors` printed `ACC [m/s^2] X: Y: Z:` on a
    ; board whose MPU6050 was answering perfectly. Affects every %.2f in
    ; the image, syslog included. A few KB of flash.
    -Wl,-u,_printf_float
    -Icommon/lib/mcu_env
    -Icommon/lib/sensor_factory
    -Icommon/lib/uros_transport
    -Icommon/lib/hw_factory
    -Icommon/lib/board_init
    -Icommon/lib/i2c_probe
    -Icommon/lib/imu
    -DCONFIG_PATH=\"custom/lino_base_config.h\"
    -D PICO

