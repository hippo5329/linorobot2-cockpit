; ==============================================================================
; Release matrix — four boards x two ROS 2 distributions.
;
; A micro-ROS image is distro-specific: board_microros_distro selects the
; precompiled micro_ros library the firmware links against, and a jazzy image
; will not talk to a lyrical agent. platformio_base.ini pins [env]
; board_microros_distro = jazzy, so the envs above are the jazzy half of the
; matrix; these are the lyrical half.
;
; PlatformIO 6.2 has no default for ${sysenv.VAR} -- an unset variable
; interpolates to the empty string and the build breaks -- so the distro is
; named explicitly here rather than taken from the environment.
;
;     pio run -d firmware -e pico2            # jazzy
;     pio run -d firmware -e pico2_lyrical    # lyrical
; ==============================================================================

[env:esp32_lyrical]
extends = env:esp32
board_microros_distro = lyrical

[env:esp32s3_lyrical]
extends = env:esp32s3
board_microros_distro = lyrical

[env:pico_lyrical]
extends = env:pico
board_microros_distro = lyrical

[env:pico2_lyrical]
extends = env:pico2
board_microros_distro = lyrical

; The W boards are what the RP2 releases are built from now: same RP2040/RP2350
; silicon, and the radio compiled in but off until an AP list is entered. A W
; image runs on a non-W board -- verified on a plain Pico 2 on 2026-09-20 --
; because nothing initialises the CYW43 unless Wi-Fi is actually wanted AND
; there is something to connect to.
[env:picow_lyrical]
extends = env:picow
board_microros_distro = lyrical

[env:pico2w_lyrical]
extends = env:pico2w
board_microros_distro = lyrical
