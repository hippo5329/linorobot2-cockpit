; ==============================================================================
; Linorobot2 Cockpit — Shared PlatformIO Base Configuration
; ==============================================================================

[platformio]
default_envs = esp32

[env]
framework = arduino
monitor_speed = 921600
lib_extra_dirs = common/lib
board_microros_distro = jazzy
; Adds -DFW_GIT_REV / -DFW_BUILD_DATE, which the boot banner prints. That banner
; is the only way to ask a board which build it is carrying -- the env partition
; describes the robot, never the image -- so it is what lets a run skip the
; reflash. Path is relative to the project dir (firmware/), like every other
; PlatformIO script key.
extra_scripts = pre:common/build_stamp.py
# custom, not serial: the transport is chosen at BOOT from the env partition,
# not here. firmware/common/lib/uros_transport supplies the four functions
# micro-ROS asks for and dispatches them to a Stream or a WiFiUDP socket. This
# is what lets one esp32 binary serve both the serial and the udp4 robots --
# board_microros_transport is otherwise the last thing forcing two builds of
# one board.
board_microros_transport = custom
lib_deps =
    https://github.com/hippo5329/micro_ros_platformio
    mcauser/i2cdetect
    jrowberg/I2Cdevlib-Core
    jrowberg/I2Cdevlib-ADXL345
    jrowberg/I2Cdevlib-AK8975
    jrowberg/I2Cdevlib-HMC5843
    jrowberg/I2Cdevlib-HMC5883L
    jrowberg/I2Cdevlib-ITG3200
    jrowberg/I2Cdevlib-MPU6050
    https://github.com/dthain/QMC5883L
    https://github.com/wollewald/INA219_WE
    https://github.com/sparkfun/SparkFun_BNO080_Arduino_Library
    https://github.com/arcao/Syslog
    adafruit/Adafruit BusIO
    adafruit/Adafruit PWM Servo Driver Library
    SPI
    Wire

; The custom partition table carves out an `env` partition. The Wi-Fi keys and
; the agent / syslog / LiDAR-UDP addresses live there rather than in the
; application image, so a prebuilt image can be re-keyed for another network by
; rewriting 4 KB of flash instead of rebuilding. See partitions_lino.csv.
[base_esp32]
platform = espressif32
board = esp32doit-devkit-v1
upload_speed = 921600
board_build.partitions = common/partitions_lino.csv
board_microros_user_meta = esp32.meta
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo
    madhephaestus/ESP32Encoder

[base_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.partitions = common/partitions_lino.csv
board_microros_user_meta = esp32.meta
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo
    madhephaestus/ESP32Encoder

[base_pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
lib_ldf_mode = chain+
upload_protocol = picotool
board_microros_user_meta = atomic.meta
lib_deps =
    ${env.lib_deps}
    https://github.com/gbr1/rp2040-encoder-library.git

[base_pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
lib_ldf_mode = chain+
upload_protocol = picotool
board_microros_user_meta = atomic.meta
lib_deps =
    ${env.lib_deps}
    https://github.com/gbr1/rp2040-encoder-library.git

[base_picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
board_build.core = earlephilhower
lib_ldf_mode = chain+
upload_protocol = picotool
board_build.filesystem_size = 1m
board_microros_user_meta = atomic.meta
lib_deps =
    ${env.lib_deps}
    https://github.com/gbr1/rp2040-encoder-library.git

[base_pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
board_build.core = earlephilhower
lib_ldf_mode = chain+
upload_protocol = picotool
board_build.filesystem_size = 1m
board_microros_user_meta = atomic.meta
lib_deps =
    ${env.lib_deps}
    https://github.com/gbr1/rp2040-encoder-library.git


