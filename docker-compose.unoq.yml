# The Arduino UNO Q: run the stack ON the board, with the 1-Click able to flash its STM32.
#
#   docker compose -f docker-compose.yml -f docker-compose.unoq.yml up -d
#
# The board's MCU has no USB. Its micro-ROS link is the QRB2210's internal UART
# (/dev/ttyHS1, char major 239), and its SWD lines are QRB2210 GPIOs (/dev/gpiochip*,
# major 254) driven by the OpenOCD Arduino ships in /opt/openocd. That OpenOCD is built
# for the board's Debian and links libgpiod.so.3, which the robot image does not have, so
# the container runs it through the HOST's loader and libraries, mounted read-only at
# /host-lib (scripts/unoq_swd.py). Nothing here applies to any other robot computer.
#
# Before the first run, free the link from Arduino's router (it owns /dev/ttyHS1) and
# install the boot-line service in its place -- the router also drives the STM32's BOOT0
# line low at every start, and without it the MCU boots its ROM bootloader after a power
# cycle. The 1-Click sets the same lines before every flash; the service covers a boot
# with no 1-Click:
#   sudo systemctl disable --now arduino-router arduino-router-serial
#   sudo cp docker/unoq/lino-stm32-boot.service /etc/systemd/system/
#   sudo systemctl enable --now lino-stm32-boot
services:
  cockpit:
    volumes:
      - /opt/openocd:/opt/openocd:ro
      - /lib/aarch64-linux-gnu:/host-lib:ro
      # The board's device tree says it is a UNO Q ("arduino,imola"), but Docker masks
      # /sys/firmware: without this the cockpit saw no board and refused its own 1-Click.
      - /sys/firmware/devicetree/base/compatible:/host-dt/compatible:ro
    # Compose APPENDS this list to the base file's (ttyACM, ttyUSB, raw USB), and an older
    # compose (2.26, the UNO Q's) rejects a rule given twice -- so only the two new classes.
    # The micro-ROS agent runs real-time (SCHED_RR; scripts/agent_rt.py, put in front of it by
    # bringup.launch.py when LINO_AGENT_RT_PRIO is set) so SLAM + Nav2 cannot keep it from
    # draining the 2 Mbaud UART. Not pinned: one CPU for all its threads (Fast DDS included)
    # starved the serial reader at Nav2's start. SYS_NICE and an rtprio limit are what a
    # real-time policy needs inside a container.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 95
    environment:
      - LINO_AGENT_RT_PRIO=50
    device_cgroup_rules:
      - 'c 239:* rwm'   # /dev/ttyHS1, the MCU's micro-ROS link
      - 'c 254:* rwm'   # /dev/gpiochip*, the MCU's SWD lines (OpenOCD linuxgpiod)
