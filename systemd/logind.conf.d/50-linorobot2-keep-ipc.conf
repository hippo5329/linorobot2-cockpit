# The cockpit's ROS 2 stack keeps its Fast DDS shared memory in the host's /dev/shm
# (docker-compose.yml: ipc: host + /dev/shm), as the uid of the robot computer's login user.
# systemd-logind's default RemoveIPC=yes deletes every /dev/shm file a user owns when that
# user's last session ends -- log out of your last SSH session and the running stack's
# segments go with it: the topics are still listed, but a reader started afterwards (the Map
# Viewer reconnecting, a test, Nav2 restarting) receives nothing until bringup restarts.
# Installed by scripts/install_keep_ipc.sh.
[Login]
RemoveIPC=no
